services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: pt_smm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pt_smm_scada}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-pt_smm_scada}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pt_smm_dashboard
    restart: unless-stopped
    ports:
      - "0.0.0.0:${PORT:-8787}:8787"
    environment:
      PORT: 8787
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pt_smm_scada}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      SMM_MYSQL_HOST: ${SMM_MYSQL_HOST:-192.168.100.82}
      SMM_MYSQL_PORT: ${SMM_MYSQL_PORT:-3306}
      SMM_MYSQL_USER: ${SMM_MYSQL_USER:-root}
      SMM_MYSQL_PASSWORD: ${SMM_MYSQL_PASSWORD:-}
      SMM_MYSQL_DATABASE: ${SMM_MYSQL_DATABASE:-qr_code_db}
      SOLAR_SYNC_INTERVAL_MS: ${SOLAR_SYNC_INTERVAL_MS:-15000}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

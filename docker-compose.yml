services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: pt_smm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pt_smm_scada}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-pt_smm_scada}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pt_smm_dashboard
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      PORT: 8787
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pt_smm_scada}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      SMM_MYSQL_HOST: ${SMM_MYSQL_HOST:-192.168.100.82}
      SMM_MYSQL_PORT: ${SMM_MYSQL_PORT:-3306}
      SMM_MYSQL_USER: ${SMM_MYSQL_USER:-root}
      SMM_MYSQL_PASSWORD: ${SMM_MYSQL_PASSWORD:-}
      SMM_MYSQL_DATABASE: ${SMM_MYSQL_DATABASE:-qr_code_db}
      SOLAR_SYNC_INTERVAL_MS: ${SOLAR_SYNC_INTERVAL_MS:-15000}
      MLX_MODEL: ${MLX_MODEL:-mlx-community/Llama-3.2-1B-Instruct-4bit}
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.orb.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ./services/ai-assistant
      dockerfile: Dockerfile
    container_name: pt_smm_ai_service
    restart: unless-stopped
    expose:
      - "8090"
    environment:
      PORT: 8090
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pt_smm_scada}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      MLX_URL: http://host.orb.internal:8080
      MLX_MODEL: ${MLX_MODEL:-mlx-community/Llama-3.2-1B-Instruct-4bit}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.orb.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  solar-sync-worker:
    build:
      context: ./services/solar-sync-worker
      dockerfile: Dockerfile
    container_name: pt_smm_solar_sync_worker
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pt_smm_scada}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      SMM_MYSQL_HOST: ${SMM_MYSQL_HOST:-192.168.100.82}
      SMM_MYSQL_PORT: ${SMM_MYSQL_PORT:-3306}
      SMM_MYSQL_USER: ${SMM_MYSQL_USER:-root}
      SMM_MYSQL_PASSWORD: ${SMM_MYSQL_PASSWORD:-}
      SMM_MYSQL_DATABASE: ${SMM_MYSQL_DATABASE:-qr_code_db}
      SOLAR_SYNC_INTERVAL_MS: ${SOLAR_SYNC_INTERVAL_MS:-15000}
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.orb.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  emqx:
    image: emqx/emqx:5.8.0
    container_name: pt_smm_emqx
    restart: unless-stopped
    ports:
      - "${EMQX_MQTT_PORT:-1889}:1883"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    environment:
      EMQX_NODE__NAME: emqx@node.pt_smm
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DEFAULT_PASSWORD:-public}
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log

  scada-ingest:
    build:
      context: ./services/scada-ingest
      dockerfile: Dockerfile
    container_name: pt_smm_scada_ingest
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pt_smm_scada}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      MQTT_BROKER: ${MQTT_BROKER:-tcp://emqx:1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-pt_smm/telemetry/#}
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.orb.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: pt_smm_nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:${PORT:-8787}:8787"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - ai-service

volumes:
  postgres_data:
  emqx_data:
  emqx_log:
